name: habitat-mosaic-gpt5
channels:
  - conda-forge
dependencies:
  - python=3.11
  - gdal>=3.8
  - numpy>=1.24
  - tqdm>=4.66

# Minimal environment: only what the script directly imports (python, gdal, numpy, tqdm).
# GDAL pulls required compression/codec libraries transitively; no need to pin libjpeg-turbo, zstd, libiconv.
# Removed certifi, setuptools, typing_extensions as they are not referenced.
# If you later need extra geospatial tooling, you can add rasterio or pyproj.

# Usage:
#   conda env create -f environment_gpt5.yml
#   conda activate habitat-mosaic-gpt5
#   python 01-combine-raw-geotiffs_gpt5.py
